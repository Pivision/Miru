name: Verify

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:layers
      - run: npm run check:schema
      - run: npm run build

      - name: End-to-end tests
        run: |
          npm run harness > harness.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/; then
              break
            fi
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8787/; then
            echo "harness failed to start, log follows:"
            cat harness.log
            exit 1
          fi
          npm run test:e2e
      - name: Attach harness log on failure
        if: failure()
        run: cat harness.log
